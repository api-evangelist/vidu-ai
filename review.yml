  - url: https://platform.vidu.com/docs/start-end-to-video
    type: Documentation
    note: Start-end frame POST /ent/v2/start-end2video.
  - url: https://docs.platform.vidu.com/7207545m0
    type: APIReference
    note: API Call Method - token auth (Authorization Token), async task pattern, get creation / status query.
  - url: https://www.prnewswire.com/news-releases/shengshu-technology-lays-foundation-for-scalable-ai-video-generation-with-launch-of-vidu-api-offering-instant-access-and-industry-leading-speed-for-enterprises--developers-302375882.html
    type: PressRelease
    note: Shengshu Technology launch of the Vidu API; open access, credit pricing ($0.05/credit, from $10), U-ViT, multi-entity consistency.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Vidu's own public API is asynchronous
    request/response REST (POST to create a task, GET to poll) plus an optional
    outbound callback webhook. No AsyncAPI document was created because there is
    no server-push transport on Vidu's own API to model.
