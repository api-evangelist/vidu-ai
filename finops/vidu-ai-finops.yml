principles:
- name: Visibility
  description: Track credit consumption per feature and model; monitor the account credit balance and burn rate.
- name: Allocation
  description: Use separate API keys per workload or team to attribute credit spend to cost centers.
- name: Optimization
  description: Route non-urgent jobs to off-peak mode, pick the lowest sufficient model tier and resolution, and cap clip duration to reduce credits per task.
- name: Accountability
  description: Set prepaid budgets, assign owners per key, and review credit burn before topping up.
