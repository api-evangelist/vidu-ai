description: >-
  FinOps view of Vidu API spend. Vidu bills on a prepaid, credit-based model:
  accounts buy credits (launch base price ~$0.05/credit) and each generation
  task consumes credits according to the feature (text-to-video, image-to-video,
  reference-to-video, start-end frame, upscale), model tier, resolution,
  duration, and aspect ratio. A four-second clip costs roughly 4 to 40 credits.
  Off-peak processing reduces per-task credit cost in exchange for a longer
  queue window. Cost control centers on choosing the right model/resolution,
  batching non-urgent work into off-peak, and monitoring the credit burn rate.
notes: >-
  Credit costs per feature and model change over time; reconcile against the
  Vidu platform pricing/credit table. Per-credit price reflects the public API
  launch announcement.
