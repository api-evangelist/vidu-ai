aid: vidu-ai
url: https://raw.githubusercontent.com/api-evangelist/vidu-ai/refs/heads/main/apis.yml
name: Vidu
kind: company
description: >-
  Vidu is a generative video AI platform from Shengshu Technology (ShengShu /
  生数科技), built on the company's U-ViT diffusion-transformer architecture.
  The Vidu API turns text prompts, still images, and reference subjects into
  short video clips with features like text-to-video, image-to-video,
  reference-to-video (multi-entity / character consistency), start-and-end
  frame interpolation, and video upscaling. The API is a REST create-then-poll
  service - callers submit an asynchronous generation task, then poll the task
  status endpoint (or receive a callback) for the finished video URL. Access is
  open to individual developers and businesses on a prepaid, credit-based model
  with no application required.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Video Generation
- AI Video
- Generative AI
- Text-to-Video
- Image-to-Video
- Reference-to-Video
- U-ViT
- Diffusion
